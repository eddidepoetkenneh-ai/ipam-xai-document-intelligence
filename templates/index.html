<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>IPAM Document Intelligence</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>IPAM Explainable AI Document Intelligence</h1>
    <p>Upload a PDF, DOCX, or scanned image to test the document-processing pipeline.</p>
    <form id="uploadForm">
      <input id="file" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg,.tiff,.bmp" required>
      <button>Process Document</button>
    </form>
    <pre id="result"></pre>
  </main>
<script>
const form=document.getElementById('uploadForm');
form.addEventListener('submit', async e=>{
  e.preventDefault();
  const fd=new FormData();
  fd.append('file',document.getElementById('file').files[0]);
  const r=await fetch('/api/documents',{method:'POST',body:fd});
  document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2);
});
</script>
</body>
</html>
